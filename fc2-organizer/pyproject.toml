[project]
name = "fc2-metadata-core"
version = "0.1.0"
description = "Independent FC2 metadata contracts and number normalization (Phase 1)."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
